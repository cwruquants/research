# Word lists that run as keyword sets in the database (public.keyword_sets.name).
# `research backfill` matches these. A list's options must stay the same once it has
# runs in the DB; to change them, add a new set (e.g. risk_v2) instead. To redo every run
# with new code, add versioned copies (e.g. risk_2026_11) and run `research backfill --sets`.
#
#   file                 CSV under the repo root, one keyword or phrase per cell
#   normalize_phrases    also match multi-word keywords across stopwords and plurals
#   exclusions           CSV of terms of art whose words never count ("risk management")
#   exclude_safe_harbor  skip safe-harbor sentences and the two sentences either side

[risk]
file = "data/word_sets/Risk.csv"

[activeness]
file = "data/word_sets/activeness.csv"

# The rerun (2026-11). Run with `research backfill --from-db --sets risk_2026_11 activeness_2026_11`.
# risk_2026_11: Risk_v2, approved 2026-11-01 (no "question(s)", "venture", "chance" or "bet").
[risk_2026_11]
file = "data/word_sets/Risk_v2.csv"
normalize_phrases = true
exclusions = "data/word_sets/Risk_v2_exclusions.csv"
exclude_safe_harbor = true

# activeness_2026_11: activeness_v2, decided 2026-11-11. Leaves out the outlook words (expect,
# guidance, anticipate, forecast; plan and strategy stay) and nouns for a thing rather than
# an action (project, insurance, security), and excludes terms of art ("balance sheet",
# "adjusted EBITDA", "prepared remarks").
[activeness_2026_11]
file = "data/word_sets/activeness_v2.csv"
exclusions = "data/word_sets/activeness_exclusions.csv"
exclude_safe_harbor = true
